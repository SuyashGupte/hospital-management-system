server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: hospital-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  # NOTE: the database connection is NOT configured here. The legacy data access layer
  # (HibernateUtil / HospitalService) is kept unmodified and reads
  # src/main/resources/hibernate.cfg.xml (see hibernate.cfg.xml.example).

app:
  jwt:
    # HS256 needs >= 32 bytes. Override in every non-local environment: export JWT_SECRET=...
    secret: ${JWT_SECRET:change-me-hospital-dev-secret-key-0123456789-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    # Allowed origins and local development patterns
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,Origin,X-Requested-With
    exposed-headers: Authorization,Content-Disposition
    allow-credentials: true
    max-age-seconds: 3600

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  file:
    name: logs/hospital-backend.log
  level:
    root: INFO
    com.hospital: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
